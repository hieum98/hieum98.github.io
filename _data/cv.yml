  summary: >-
    NLP researcher and Ph.D. candidate in Computer Science at the University of Oregon (expected 2027),
    two-time Amazon Applied Scientist intern, with papers at venues including ACL, SIGIR, EMNLP, and AAAI.
    My research is on task-aware information modeling: enabling AI systems to identify the information a task depends on,
    represent it so it stays reliable when language, genre, or topic shifts, and reason over it across many steps.
    When any step fails, a system can answer confidently from the wrong information, a main reason AI is still hard to trust in high-stakes settings.
    I want to build retrieval and reasoning systems that learn which evidence to find, keep, and act on.

