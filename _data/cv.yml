        start_date: 2026-06
        end_date: 2026-09
        highlights:
          - "**FORK: agent guardrails that explain rejections safely.** Built a guardrail for tool-using LLM agents whose rejection messages help the agent recover without helping the attacker. On FORK-World (677 adaptive-attack scenarios), it cut attack success from 78.4% to 14.1% on average (best baseline: 55.0%) while keeping utility above 85%; on MT-AgentRisk, with environments and tasks unseen in training, from 70.6% to 9.1%."
          - "**Gradient-free co-evolution.** Co-evolved the guardrail's decision and disclosure skills, kept as a natural-language library, with an attacker that reads every rejection message. Learned from 65 training pairs without weight updates, the frozen library transfers to unseen tasks, environments, and guardrail LLMs. Also built the FORK-World benchmark."

      - company: Amazon AWS
        position: Applied Scientist Intern
        location: New York, NY
        start_date: 2025-06
        end_date: 2025-09
        highlights:
          - "**State-Aware RAG.** Built a trainable working memory (Qwen3-4B extractor) that filters and updates retrieved evidence for multi-hop reasoning, with the retriever and generator frozen. Beat the best memory-augmented and RL-enhanced baselines by 8.6% and 9.3% on average across eight QA benchmarks, six unseen in training (Findings of ACL 2026; [public code](https://github.com/amazon-science/state-aware-rag))."
          - "**RL post-training with a Path-Outcome Dual Reward.** Designed a reward that also scores every reasoning step with an LLM judge, after an outcome-only reward credited lucky guesses. Trained the extractor with LoRA SFT on about 70K MCTS-synthesized state-action pairs, then with GRPO in verl, using LangGraph for multi-step rollouts on multi-GPU clusters."

      - company: University of Oregon
        position: Research Assistant
        location: Eugene, OR
        start_date: 2023-03
        highlights:
          - "**LLM embeddings for retrieval.** Built ULLME (EMNLP 2024 Demo; [open-source](https://github.com/nlp-uoregon/ullme), 1.5B to 8B checkpoints), which unifies contrastive and generation-augmented training and beats LLM2Vec trained on the same data by 1.2 to 2.0 points on MTEB. LUSIFER (SIGIR 2025) adapts an English-centric embedding model to other languages with English-only training, beating E5-Mistral by 3.19 points on average across 14 languages."
          - "**Agentic RAG over graph and text memory.** Built agentic RAG systems with an explicit working memory for long-horizon reasoning. Co-E ([preprint](https://arxiv.org/abs/2607.23278), 2026) keeps graph and text memory in sync without any training; on an 8B open model, it beats comparable training-free baselines on six multi-hop QA benchmarks (+10.3 EM over HopRAG with GPT-4o on MuSiQue)."
          - "**Robust representations under distribution shift (IARPA HIATUS).** Built the style embedding model that RTX BBN Technologies, the team lead, selected for the team's submission to the program's evaluations. Developed authorship attribution and machine-generated text detection methods robust across genres, topics, and languages: counterfactual augmentation (SIGIR 2024; released as [ERLAS](https://huggingface.co/Hieuman/erlas), 3,900+ downloads on Hugging Face) and EAVAE (ACL 2026; state of the art on Amazon Reviews, PAN21, and HRS)."
          - "**Event relations and causality.** Developed document-level event relation and event causality identification methods that capture long-range context, using optimal transport (LREC-COLING 2024) and diffusion models (AAAI 2024)."

      - company: VinAI Research
